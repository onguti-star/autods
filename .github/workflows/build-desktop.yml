name: Build desktop apps

# Runs on GitHub's free build machines (no credit card needed for public repos).
#   - Manually:  Actions tab -> "Build desktop apps" -> Run workflow
#   - Release:   git tag v1.0.0 && git push origin v1.0.0
#                (builds all three and attaches them to a GitHub Release)
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04      # older glibc, so the Linux build runs on more distros
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest      # Apple Silicon
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements-desktop.txt
      - name: System libraries for the native window (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libegl1 libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r requirements-desktop.txt
      - name: Build
        run: python build_desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: AutoDS-${{ matrix.name }}
          path: dist/release/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
